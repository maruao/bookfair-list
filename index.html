<style>
/* Layout: wide screens put the zoomable hall map left and the booth checklist right; phones stack them, map first. */
:root {
  --bg: #edf1f7;
  --surface: #ffffff;
  --ink: #13203a;
  --muted: #566178;
  --line: #d5dce8;
  --accent: #f27a1a;
  --accent-soft: #fde6d2;
  --pin: #13203a;
  --pin-fg: #ffffff;
  --done: #1f8f55;
  --scrim: rgba(8, 14, 26, 0.86);
  --scrim-fg: #ffffff;
  --font-display: 'Mitr', 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif;
  --font-body: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1626;
    --surface: #17223a;
    --ink: #eaf0fb;
    --muted: #9aa7c0;
    --line: #2a3858;
    --accent: #ff9a4d;
    --accent-soft: #3a2a1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1626;
  --surface: #17223a;
  --ink: #eaf0fb;
  --muted: #9aa7c0;
  --line: #2a3858;
  --accent: #ff9a4d;
  --accent-soft: #3a2a1f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top .titles { min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(26px, 6vw, 38px); line-height: 1.2; text-wrap: balance; }
.progress { min-width: 180px; flex: 0 1 260px; }
.progress .count { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.progress .count strong { font-family: var(--font-display); font-weight: 500; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); transition: width 0.25s ease; }

.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); } .side { position: sticky; top: 16px; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.mapcard { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.maptools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.zoom { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.zoom:hover { border-color: var(--muted); }
.mapwrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: #ffffff; -webkit-overflow-scrolling: touch; }
.map { position: relative; width: 100%; aspect-ratio: 1600 / 1104; }
.map.zoomed { width: 1200px; }
.map img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }

.pin {
  position: absolute; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-display); font-weight: 500; font-size: 14px; line-height: 1;
  color: var(--pin-fg); background: var(--pin);
  border: 2px solid #ffffff; border-radius: 999px; padding: 6px 10px; cursor: pointer;
  box-shadow: 0 1px 4px rgba(10, 20, 40, 0.45);
  min-height: 32px;
}
.pin[aria-pressed="true"] { box-shadow: 0 0 0 4px rgba(19, 32, 58, 0.35), 0 2px 8px rgba(10, 20, 40, 0.5); z-index: 2; font-size: 15px; }
.pin.done { background: var(--done); }
.pin:focus-visible, .tab:focus-visible, .zoom:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pin svg { width: 12px; height: 12px; display: none; }
.pin.done svg { display: block; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: #f58220; display: inline-block; }

.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
.tab {
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0;
  display: flex; flex-direction: column; gap: 0;
}
.tab .code { font-family: var(--font-display); font-weight: 500; font-size: 18px; line-height: 1.3; }
.tab .name { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.tab .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

.panel { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panelhead { display: flex; align-items: center; gap: 12px; }
.badge { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; }
.panelhead h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.3; }
.panelhead p { margin: 0; font-size: 13px; color: var(--muted); }
.series h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; line-height: 1.45; text-wrap: balance; overflow-wrap: anywhere; }
.group + .group { margin-top: 12px; }
.glabel { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.vols { display: flex; flex-wrap: wrap; gap: 8px; }
.vol { position: relative; display: inline-flex; }
.vol input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.vol .chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  font-variant-numeric: tabular-nums; font-weight: 500;
}
.chip .tick { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.chip .tick svg { width: 12px; height: 12px; opacity: 0; }
.vol input:checked + .chip { border-color: var(--done); color: var(--muted); text-decoration: line-through; }
.vol input:checked + .chip .tick { background: var(--done); border-color: var(--done); }
.vol input:checked + .chip .tick svg { opacity: 1; }
.vol input:focus-visible + .chip { outline: 3px solid var(--accent); outline-offset: 2px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }

.meta { display: inline-flex; align-items: center; gap: 8px; }
.volwrap { position: relative; display: inline-flex; }
.vol .chip.cover { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 6px 8px; width: 104px; min-height: 0; }
.chip.cover img { display: block; width: 100%; max-width: 100%; aspect-ratio: 900 / 1328; object-fit: cover; border-radius: 6px; background: var(--line); }
.chip.cover .meta { justify-content: center; }
.vol input:checked + .chip.cover img { opacity: 0.45; }
.zoomimg {
  position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 8px; background: var(--scrim); color: var(--scrim-fg); cursor: pointer; z-index: 2;
}
.zoomimg svg { width: 18px; height: 18px; }
.zoomimg:focus-visible, .lbclose:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.lb {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim); color: var(--scrim-fg);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lb figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; min-width: 0; }
.lb img { display: block; max-width: min(100%, 520px); max-height: 78vh; width: auto; height: auto; border-radius: 8px; }
.lb figcaption { font-weight: 500; }
.lbclose {
  position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--scrim-fg); border-radius: 10px; background: transparent; color: var(--scrim-fg); cursor: pointer;
}
.lbclose svg { width: 20px; height: 20px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

  document.getElementById('lbclose').addEventListener('click', closeLightbox);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

  function render() { renderTabs(); renderPanel(); renderPins(); renderTotals(); }

  function setZoom(on) {
    map.classList.toggle('zoomed', on);
    zoomBtn.textContent = on ? 'พอดีจอ' : 'ขยายแผนที่';
    zoomBtn.setAttribute('aria-pressed', String(on));
    if (on) centerOn(byId(selected)); else wrap.scrollLeft = 0;
  }
  zoomBtn.addEventListener('click', function () { setZoom(!map.classList.contains('zoomed')); });

  render();
  setZoom(wrap.clientWidth < 700);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
